apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// Version comes from package.json: versionName "0.1.0", versionCode 0*10000 + 1*100 + 0 = 100.
// Every release must bump package.json so the code goes up, or Android refuses the update.
def pkg = new groovy.json.JsonSlurper().parse(rootProject.file('../package.json'))
def (vMajor, vMinor, vPatch) = pkg.version.tokenize('.').collect { it.replaceAll(/\D.*/, '') as int }

// Release signing reads android/keystore.properties (git-ignored; see keystore.properties.example).
// Without it, release builds come out unsigned and tools/release.sh stops.
def keystoreFile = rootProject.file('keystore.properties')
def keystore = new Properties()
if (keystoreFile.exists()) keystoreFile.withInputStream { keystore.load(it) }

android {
    namespace = "io.github.mecheng70.pitplanner"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.mecheng70.pitplanner"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode vMajor * 10000 + vMinor * 100 + vPatch
        versionName pkg.version
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystore['storeFile']) {
                storeFile file(keystore['storeFile'].replaceFirst('^~', System.getProperty('user.home')))
                storePassword keystore['storePassword']
                keyAlias keystore['keyAlias']
                keyPassword keystore['keyPassword']
            }
        }
    }
    buildTypes {
        // Dev copy installs next to the signed release: own app ID, own data, label "Pit Planner dev".
        // tools/device/ drives this package only.
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-dev"
        }
        release {
            if (keystore['storeFile']) signingConfig signingConfigs.release
            // -PdebuggableRelease: release-signed but inspectable, only to move data from a debug install.
            debuggable project.hasProperty('debuggableRelease')
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

// Kotlin matches the Java 21 target Capacitor sets in capacitor.build.gradle.
kotlin {
    compilerOptions { jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21 }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.core:core-ktx:$androidxCoreVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
