<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Setup: what do you cook on</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FF8F4A}a:hover{color:#FFB07F}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #131211; color: #F1EBE5; font-family: Roboto, system-ui, sans-serif; display: flex; flex-direction: column; padding: 24px 20px 24px; gap: 20px; overflow: hidden">

<div style="display: flex; gap: 6px; padding-top: 8px" aria-label="Step 2 of 3">
<span style="flex: 1; height: 4px; border-radius: 2px; background: #FF8F4A"></span>
<span style="flex: 1; height: 4px; border-radius: 2px; background: #FF8F4A"></span>
<span style="flex: 1; height: 4px; border-radius: 2px; background: #3A3633"></span>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-size: 28px; font-weight: 500; line-height: 1.2">What do you cook on?</h1>
<p style="margin: 0; font-size: 15px; color: #B5ABA2; line-height: 1.45">Times and alerts are planned around your gear. You can change this later.</p>
</div>

<div style="background: #1F1D1B; border: 2px solid #FF8F4A; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 12px">
<div style="width: 40px; height: 40px; border-radius: 20px; background: #3A2619; display: flex; align-items: center; justify-content: center; flex: none">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FF8F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22c4 0 7-2.7 7-6.5 0-3.3-2.2-5.5-3.6-7.2-.4 1.6-1.3 2.7-2.4 3.2C13 8 12 5 9 2c0 4-4 6.7-4 11.5C5 19.3 8 22 12 22z"/></svg>
</div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 16px; font-weight: 500">Pellet smoker</span>
<span style="font-size: 13px; color: #B5ABA2">Hopper and grate filled from the model</span>
</div>
<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#FF8F4A"/><path d="M7.5 12.5l3 3 6-6" fill="none" stroke="#23130A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
</div>
<a href="Picker.dc.html" style="display: flex; align-items: center; justify-content: space-between; min-height: 56px; border-radius: 12px; border: 1px solid #4A4541; background: #131211; color: #F1EBE5; padding: 0 14px; text-decoration: none">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #B5ABA2">Model</span><span style="font-size: 16px">Pit Boss 820</span></span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B5ABA2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
</a>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #B5ABA2">Hopper (lb)
<input value="21" inputmode="numeric" style="height: 48px; border-radius: 12px; border: 1px solid #4A4541; background: #131211; color: #F1EBE5; font-size: 16px; padding: 0 14px">
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #B5ABA2">Main grate (sq in)
<input value="593" inputmode="numeric" style="height: 48px; border-radius: 12px; border: 1px solid #4A4541; background: #131211; color: #F1EBE5; font-size: 16px; padding: 0 14px">
</label>
</div>
</div>

<div style="background: #1F1D1B; border-radius: 20px; display: flex; flex-direction: column">
<label style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; min-height: 48px">
<div style="width: 40px; height: 40px; border-radius: 20px; background: #1C2B38; display: flex; align-items: center; justify-content: center; flex: none">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8EC2F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="8" rx="2"/><path d="M6 16v3M18 16v3"/></svg>
</div>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 500">Griddle</span><span style="font-size: 13px; color: #B5ABA2">Searing, chicken, wings</span></span>
<input type="checkbox" checked role="switch" aria-label="Griddle" style="width: 52px; height: 32px; accent-color: #FF8F4A">
</label>
<div style="height: 1px; background: #2E2B28; margin: 0 16px"></div>
<label style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; min-height: 48px">
<div style="width: 40px; height: 40px; border-radius: 20px; background: #2A2725; display: flex; align-items: center; justify-content: center; flex: none">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#D8CFC7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M7 13h10"/></svg>
</div>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 500">Oven for holding</span><span style="font-size: 13px; color: #B5ABA2">Lowest setting 170F</span></span>
<input type="checkbox" checked role="switch" aria-label="Oven for holding" style="width: 52px; height: 32px; accent-color: #FF8F4A">
</label>
</div>

<button style="height: 48px; border: 1px dashed #4A4541; border-radius: 24px; background: transparent; color: #D8CFC7; font-size: 15px">Add another cooker</button>

<div style="margin-top: auto; display: flex; gap: 12px">
<button style="flex: 1; height: 56px; border-radius: 28px; border: 1px solid #4A4541; background: transparent; color: #F1EBE5; font-size: 16px; font-weight: 500">Back</button>
<button style="flex: 2; height: 56px; border-radius: 28px; border: none; background: #FF8F4A; color: #23130A; font-size: 16px; font-weight: 500">Continue</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
