<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pick your smoker</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FF8F4A}a:hover{color:#FFB07F}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0A0909; color: #F1EBE5; font-family: Roboto, system-ui, sans-serif; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; position: relative">

<div aria-hidden="true" style="position: absolute; top: 56px; left: 20px; right: 20px; font-size: 28px; font-weight: 500; color: #4A4541">What do you cook on?</div>

<div role="dialog" aria-label="Pick your smoker" style="height: 744px; background: #1F1D1B; border-radius: 28px 28px 0 0; display: flex; flex-direction: column; overflow: hidden">
<div style="display: flex; justify-content: center; padding: 10px 0 4px"><span style="width: 32px; height: 4px; border-radius: 2px; background: #5A544F"></span></div>
<div style="display: flex; align-items: center; justify-content: space-between; padding: 4px 8px 4px 20px">
<h1 style="margin: 0; font-size: 20px; font-weight: 500">Pick your smoker</h1>
<a href="Setup.dc.html" aria-label="Close" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #F1EBE5">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
</div>

<div style="padding: 4px 16px 10px">
<label style="display: flex; align-items: center; gap: 10px; height: 52px; border-radius: 26px; background: #2A2725; padding: 0 16px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B5ABA2" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
<input placeholder="Search brand or model" aria-label="Search brand or model" style="flex: 1; border: none; background: transparent; color: #F1EBE5; font-size: 16px; outline: none">
</label>
</div>

<div style="display: flex; gap: 8px; padding: 0 16px 10px; overflow: hidden; flex: none">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="5">
<sc-if value="{{c.on}}" hint-placeholder-val="{{false}}"><button aria-pressed="true" style="height: 36px; padding: 0 14px; border-radius: 18px; border: none; background: #4A2E1C; color: #FFD3B5; font-size: 14px; font-weight: 500; white-space: nowrap; flex: none">{{c.label}}</button></sc-if>
<sc-if value="{{c.off}}" hint-placeholder-val="{{true}}"><button aria-pressed="false" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #4A4541; background: transparent; color: #D8CFC7; font-size: 14px; white-space: nowrap; flex: none">{{c.label}}</button></sc-if>
</sc-for>
</div>

<div style="flex: 1; overflow: hidden; display: flex; flex-direction: column">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<div style="display: flex; justify-content: space-between; align-items: baseline; padding: 12px 20px 4px">
<h2 style="margin: 0; font-size: 13px; font-weight: 500; color: #FFB07F">{{g.name}}</h2>
<span style="font-size: 12px; color: #B5ABA2">{{g.note}}</span>
</div>
<sc-for list="{{g.items}}" as="it" hint-placeholder-count="3">
<button style="display: flex; align-items: center; justify-content: space-between; min-height: 48px; padding: 0 20px; border: none; background: {{it.bg}}; color: #F1EBE5; font-size: 16px; text-align: left; width: 100%">
<span>{{it.name}}</span>
<sc-if value="{{it.sel}}" hint-placeholder-val="{{false}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FF8F4A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-label="Selected" role="img"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></sc-if>
</button>
</sc-for>
</sc-for>
</div>

<div style="padding: 10px 16px 20px; border-top: 1px solid #2E2B28; flex: none">
<button style="width: 100%; height: 48px; border-radius: 24px; border: 1px dashed #4A4541; background: transparent; color: #D8CFC7; font-size: 15px">Not listed? Enter it yourself</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const chip = (label, on) => ({ label: label, on: on, off: !on });
const row = (name, sel) => ({ name: name, sel: !!sel, bg: sel ? '#2E221A' : 'transparent' });
return {
chips: [chip('All', true), chip('Pellet', false), chip('Kamado', false), chip('Offset', false), chip('Drum', false), chip('Gravity', false), chip('Electric', false)],
groups: [
{ name: 'Pellet', note: 'Hopper alerts', items: [row('Pit Boss 820', true), row('Pit Boss 850'), row('Traeger Pro 780'), row('Traeger Ironwood'), row('Traeger Woodridge Pro'), row('Weber Searwood'), row('recteq Bullseye'), row('Z Grills 700'), row('Yoder YS640s')] },
{ name: 'Kamado', note: 'Charcoal, long burns', items: [row('Big Green Egg'), row('Kamado Joe Classic III')] },
{ name: 'Bullet and drum', note: 'Charcoal, long burns', items: [row('Weber Smokey Mountain'), row('Pit Barrel Cooker')] },
{ name: 'Gravity charcoal', note: 'Hopper alerts', items: [row('Masterbuilt Gravity Series 1050')] },
{ name: 'Offset', note: 'Fire checks every 1-2 hr', items: [row("Oklahoma Joe's Highland"), row('Old Country Brazos')] },
{ name: 'Electric', note: 'Wood chip refills', items: [row('Masterbuilt electric smoker')] }
]
};
}
}
</script>
</body>
</html>
