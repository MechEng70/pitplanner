<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brisket details</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FF8F4A}a:hover{color:#FFB07F}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0A0909; color: #F1EBE5; font-family: Roboto, system-ui, sans-serif; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; position: relative">
<div aria-hidden="true" style="position: absolute; top: 24px; left: 20px; right: 20px; font-size: 22px; font-weight: 500; color: #4A4541">Plan</div>
<div role="dialog" aria-label="Brisket" style="background: #1F1D1B; border-radius: 28px 28px 0 0; display: flex; flex-direction: column; overflow: hidden">
<div style="display: flex; justify-content: center; padding: 10px 0 4px"><span style="width: 32px; height: 4px; border-radius: 2px; background: #5A544F"></span></div>
<div style="display: flex; align-items: center; justify-content: space-between; padding: 4px 8px 8px 20px">
<h1 style="margin: 0; font-size: 20px; font-weight: 500">Brisket</h1>
<a href="FoodPick.dc.html" aria-label="Close" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #F1EBE5"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
</div>
<div style="display: flex; flex-direction: column; gap: 16px; padding: 4px 16px 20px">
<div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 13px; color: #B5ABA2">Trimmed weight</span><div style="display: flex; align-items: center; justify-content: space-between; background: #131211; border-radius: 16px; padding: 6px"><button aria-label="Less weight" style="width: 48px; height: 48px; border-radius: 24px; border: 1px solid #4A4541; background: transparent; color: #F1EBE5; font-size: 22px">-</button><span style="font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums">12.0 <span style="font-size: 15px; color: #B5ABA2; font-weight: 400">lb</span></span><button aria-label="More weight" style="width: 48px; height: 48px; border-radius: 24px; border: 1px solid #4A4541; background: transparent; color: #F1EBE5; font-size: 22px">+</button></div></div>
<div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 13px; color: #B5ABA2">Cook on</span><div style="display: flex; gap: 8px"><button aria-pressed="true" style="height: 40px; padding: 0 14px; border-radius: 20px; border: none; background: #4A2E1C; color: #FFD3B5; font-size: 14px; font-weight: 500; white-space: nowrap">Pit Boss 820</button></div></div>
<div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 13px; color: #B5ABA2">Wrap at the stall</span><div style="display: flex; gap: 8px"><button aria-pressed="true" style="height: 40px; padding: 0 14px; border-radius: 20px; border: none; background: #4A2E1C; color: #FFD3B5; font-size: 14px; font-weight: 500; white-space: nowrap">Butcher paper</button><button aria-pressed="false" style="height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #4A4541; background: transparent; color: #D8CFC7; font-size: 14px; white-space: nowrap">Foil</button><button aria-pressed="false" style="height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #4A4541; background: transparent; color: #D8CFC7; font-size: 14px; white-space: nowrap">No wrap</button></div></div>
<div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 13px; color: #B5ABA2">Rest after pull</span><div style="display: flex; align-items: center; justify-content: space-between; background: #131211; border-radius: 16px; padding: 6px"><button aria-label="Less rest" style="width: 48px; height: 48px; border-radius: 24px; border: 1px solid #4A4541; background: transparent; color: #F1EBE5; font-size: 22px">-</button><span style="font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums">60 <span style="font-size: 15px; color: #B5ABA2; font-weight: 400">min</span></span><button aria-label="More rest" style="width: 48px; height: 48px; border-radius: 24px; border: 1px solid #4A4541; background: transparent; color: #F1EBE5; font-size: 22px">+</button></div></div>
<div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 13px; color: #B5ABA2">Timing</span><div role="radiogroup" aria-label="Timing model" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 1px solid #4A4541; border-radius: 22px; overflow: hidden; height: 44px">
<button role="radio" aria-checked="true" style="border: none; background: #FF8F4A; color: #23130A; font-size: 14px; font-weight: 500">Hours per pound</button>
<button role="radio" aria-checked="false" style="border: none; border-left: 1px solid #4A4541; background: transparent; color: #B5ABA2; font-size: 14px">Size-adjusted</button></div>
<span style="font-size: 12px; color: #B5ABA2; line-height: 1.4">0.75 hr/lb from your cooks. Size-adjusted unlocks after 3 brisket cooks in your history.</span></div>
<div style="background: #2B1D14; border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; color: #FFB07F; font-weight: 500">FOR SERVE AT 5:00 PM</span>
<span style="font-size: 20px; font-weight: 500; font-variant-numeric: tabular-nums">On 6:40 AM, off 3:40 PM</span>
<span style="font-size: 13px; color: #D8CFC7">9 hr on heat. Fire the smoker at 6:20 AM.</span>
</div>
<a href="Main.dc.html" style="height: 56px; border-radius: 28px; border: none; background: #FF8F4A; color: #23130A; font-size: 17px; font-weight: 500; display: flex; align-items: center; justify-content: center; text-decoration: none; flex: none">Add to plan</a>
</div>
</div>
</div>
</x-dc>

</html>
