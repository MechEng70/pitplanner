<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cook options</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FF8F4A}a:hover{color:#FFB07F}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0A0909; color: #F1EBE5; font-family: Roboto, system-ui, sans-serif; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; position: relative">

<div aria-hidden="true" style="position: absolute; top: 20px; left: 20px; right: 20px; display: flex; flex-direction: column; gap: 4px; color: #4A4541"><span style="font-size: 22px; font-weight: 500">Cooking</span><span style="font-size: 13px">Serve 5:00 PM</span></div>

<div role="dialog" aria-label="Cook options" style="background: #1F1D1B; border-radius: 28px 28px 0 0; display: flex; flex-direction: column; padding-bottom: 20px">
<div style="display: flex; justify-content: center; padding: 10px 0 4px"><span style="width: 32px; height: 4px; border-radius: 2px; background: #5A544F"></span></div>
<div style="display: flex; align-items: center; justify-content: space-between; padding: 4px 8px 8px 20px">
<h1 style="margin: 0; font-size: 20px; font-weight: 500">Cook options</h1>
<a href="Cook.dc.html" aria-label="Close" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #F1EBE5">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
</div>

<div style="margin: 0 16px; background: #2A2725; border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 16px; font-weight: 500">Running behind or ahead</span>
<span style="font-size: 13px; color: #B5ABA2">Shifts every step after now</span>
</div>
<div style="display: flex; align-items: center; justify-content: space-between">
<button aria-label="15 minutes earlier" style="width: 56px; height: 48px; border-radius: 24px; border: 1px solid #4A4541; background: transparent; color: #F1EBE5; font-size: 15px">-15</button>
<span style="font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums">+30 min</span>
<button aria-label="15 minutes later" style="width: 56px; height: 48px; border-radius: 24px; border: 1px solid #4A4541; background: transparent; color: #F1EBE5; font-size: 15px">+15</button>
</div>
<div role="radiogroup" aria-label="What to do with serve time" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<button role="radio" aria-checked="true" style="min-height: 52px; border-radius: 14px; border: 2px solid #FF8F4A; background: #2E221A; color: #F1EBE5; font-size: 13px; line-height: 1.3; padding: 6px 8px">Keep serve at 5:00<br><span style="color: #B5ABA2">use up hold time</span></button>
<button role="radio" aria-checked="false" style="min-height: 52px; border-radius: 14px; border: 1px solid #4A4541; background: transparent; color: #F1EBE5; font-size: 13px; line-height: 1.3; padding: 6px 8px">Move serve to 5:30<br><span style="color: #B5ABA2">tell the family</span></button>
</div>
<span style="font-size: 12px; color: #FFD3B5">Brisket hold drops from 60 to 30 min. Still OK.</span>
</div>

<div style="display: flex; flex-direction: column; margin-top: 8px">
<button style="display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 0 20px; border: none; background: transparent; color: #F1EBE5; text-align: left">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#D8CFC7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.7 21a2 2 0 0 1-3.4 0M18.6 13A16 16 0 0 1 18 8a6 6 0 0 0-9.3-5M6.3 6.3A6 6 0 0 0 6 8c0 7-3 9-3 9h14M2 2l20 20"/></svg>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px">Quiet alerts for 30 min</span><span style="font-size: 13px; color: #B5ABA2">The plan keeps running. Missed steps wait for you.</span></span></button>
<button style="display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 0 20px; border: none; background: transparent; color: #F1EBE5; text-align: left">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFB07F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22c4 0 7-2.7 7-6.5 0-3.3-2.2-5.5-3.6-7.2-.4 1.6-1.3 2.7-2.4 3.2C13 8 12 5 9 2c0 4-4 6.7-4 11.5C5 19.3 8 22 12 22z"/><path d="M4 4l16 16"/></svg>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px">Pit went out</span><span style="font-size: 13px; color: #B5ABA2">Stops the clock until you tap "Back up to temp"</span></span></button>
<button style="display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 0 20px; border: none; background: transparent; color: #F1EBE5; text-align: left">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#D8CFC7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></svg>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px">Start over</span><span style="font-size: 13px; color: #B5ABA2">Back to Plan with the same menu</span></span></button>
<div style="height: 1px; background: #2E2B28; margin: 4px 20px"></div>
<button style="display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 0 20px; border: none; background: transparent; color: #FF9A86; text-align: left">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 500">End cook</span><span style="font-size: 13px; color: #B5ABA2">Save to history or discard. Turns off all alerts.</span></span></button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
