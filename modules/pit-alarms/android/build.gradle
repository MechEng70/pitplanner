// pit-alarms: Expo module for step alarms (TECH-DESIGN section 6): the 0.2.0 plugin on the Expo Modules API.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'io.github.mecheng70.pitplanner'
version = '0.0.0'

android {
  // Same package as the 0.2.0 alarm code, so T-013 can keep the receiver class names.
  namespace "io.github.mecheng70.pitplanner.alarms"
  defaultConfig {
    versionCode 1
    versionName '0.0.0'
  }
  testOptions {
    unitTests {
      // The notification icon and the module manifest (receivers) are read by the Robolectric tests.
      includeAndroidResources = true
    }
  }
}

dependencies {
  testImplementation 'junit:junit:4.13.2'
  // Same Robolectric as expo-modules-core's own tests.
  testImplementation 'org.robolectric:robolectric:4.16.1'
}
